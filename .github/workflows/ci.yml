name: CI

# Integración continua: corre la suite GUT completa y valida que el proyecto
# importa/compila limpio en cada push y en cada Pull Request.
# Ver docs/ARCHITECTURE.md §6 (Testing) para la convención de tests del
# proyecto, y CLAUDE.md §GodotPrompter para las skills usadas al escribir
# este workflow.
on:
  push:
  pull_request:

env:
  # Debe coincidir con la versión de Godot usada localmente (ver project.godot
  # config/features y la versión reportada por el binario mono instalado).
  GODOT_VERSION: "4.7.1"

jobs:
  test:
    name: Tests (GUT)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar el guard de CI
        run: python3 -B -m unittest discover -s tests/ci -p 'test_*.py' -v

      - name: Setup Godot ${{ env.GODOT_VERSION }} (mono)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true

      - name: Importar y verificar la suite GUT completa (res://tests/unit)
        run: python3 tools/ci/run_gut.py

  build:
    name: Build (validación de importación)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot ${{ env.GODOT_VERSION }} (mono)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true

      # Esta comprobacion de importacion se conserva junto a la suite GUT.
      # Los exports por destino tienen workflows separados: Web genera un
      # artefacto descargable; Android/iOS mantienen su distribucion existente.
      # Ver docs/ARCHITECTURE.md §7 y export-web.yml.
      - name: Importar el proyecto (headless)
        run: godot --headless --path . --editor --import

  notify-on-failure:
    name: Notificar fallo en el PR
    runs-on: ubuntu-latest
    needs: [test, build]
    if: failure() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Comentar en el PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ El pipeline de CI falló en este PR (tests y/o build). Revisá la pestaña **Checks** de este PR para el detalle antes de pedir revisión.'
            })
