name: Deploy iOS test build

# Exporta el proyecto Xcode de iOS (Godot, sin firmar — ver el comentario
# de cabecera de export_presets.cfg sobre por qué Godot no invoca
# xcodebuild él mismo), lo archiva y firma con xcodebuild usando firma
# MANUAL (certificado + provisioning profile ya creados de antemano), y
# lo sube a TestFlight. Corre en un runner macOS — más lento y con cuota
# de minutos más cara que los runners Linux, por eso no se dispara en
# cada push de prueba, solo en push a `main` y manual.
#
# Por qué firma Manual y no Automatic: se probó extensamente en local
# contra Xcode real (Automatic con y sin CODE_SIGN_IDENTITY forzado, con
# distintos valores, con y sin -destination, con la sintaxis calificada
# por SDK) y en CI con -allowProvisioningUpdates + API Key. Conclusión,
# corroborada en https://developer.apple.com/forums/thread/713058 y
# https://github.com/flutter/flutter/issues/139212: xcodebuild archive
# con CODE_SIGN_STYLE=Automatic SIEMPRE intenta firmar primero con una
# identidad de Development (la firma de distribución real se aplicaría
# recién al exportar), y crear ese perfil de Development requiere al
# menos un dispositivo iOS/iPadOS registrado en la cuenta — algo que no
# siempre existe (p.ej. sin ningún iPhone/iPad a mano). Firmar Manual con
# un provisioning profile de "App Store Connect" (tipo Distribución) creado
# una sola vez a mano evita ese paso intermedio por completo: los perfiles
# de distribución nunca requieren dispositivos.
#
# Requiere estos secrets (Settings → Secrets and variables → Actions):
#   APP_STORE_CONNECT_API_KEY       -> contenido del archivo .p8 de la API Key
#                                       (solo se usa para subir a TestFlight,
#                                       no para firmar)
#   APP_STORE_CONNECT_ISSUER_ID     -> Issuer ID (mismo para todas las keys del team)
#   APP_STORE_CONNECT_KEY_ID        -> Key ID de esta API Key puntual
#   APPLE_DISTRIBUTION_CERT_P12     -> certificado "Apple Distribution" + clave
#                                       privada, exportado desde Keychain Access
#                                       como .p12, codificado en base64
#                                       (`base64 -i archivo.p12 | tr -d '\n'`)
#   APPLE_DISTRIBUTION_CERT_PASSWORD -> contraseña puesta al exportar ese .p12
#   APPLE_DISTRIBUTION_PROVISIONING_PROFILE -> el .mobileprovision de tipo
#                                       "App Store Connect" (Distribution),
#                                       creado a mano una vez en
#                                       Certificates, Identifiers & Profiles
#                                       para el App ID de esta app y firmado
#                                       con el certificado de arriba,
#                                       codificado en base64
#                                       (`base64 -i archivo.mobileprovision | tr -d '\n'`).
#                                       Si se regenera, actualizar también
#                                       PROVISIONING_PROFILE_SPECIFIER más
#                                       abajo si cambia el nombre del perfil.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  GODOT_VERSION: "4.7.1"
  APPLE_TEAM_ID: "XA43X2P8W2"

permissions:
  contents: read
  actions: read

jobs:
  deploy-ios:
    name: Exportar, firmar y subir a TestFlight
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necesario para poder comparar contra el commit del último deploy exitoso

      - name: Verificar que la versión de iOS cambió desde el último deploy exitoso
        # TestFlight rechaza subir el mismo build number dos veces para la
        # misma versión, y aunque no lo rechazara, no tiene sentido gastar
        # minutos de runner macOS re-empaquetando exactamente lo mismo que
        # ya está en TestFlight. Este paso solo corre en push automático a
        # `main` — un workflow_dispatch manual (para reintentar o depurar el
        # pipeline en sí, como en esta misma sesión) lo saltea a propósito.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_SHA=$(gh run list --workflow "Deploy iOS test build" --status success --branch main --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$LAST_SHA" ]; then
            echo "No hay un deploy de iOS exitoso previo registrado; se permite este build."
            exit 0
          fi
          CHANGED=$(git diff "$LAST_SHA" HEAD -- export_presets.cfg | grep -E '^[+-](application/version|application/short_version)=' || true)
          if [ -z "$CHANGED" ]; then
            echo "::error::La versión de iOS (application/version / application/short_version en export_presets.cfg) no cambió desde el último deploy exitoso a TestFlight ($LAST_SHA). Subí la versión antes de mergear a main — ver docs/ARCHITECTURE.md §7."
            exit 1
          fi
          echo "Versión de iOS cambió desde $LAST_SHA, se permite el deploy:"
          echo "$CHANGED"

      - name: Setup Godot ${{ env.GODOT_VERSION }} (mono)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true

      - name: Crear directorio de salida
        run: mkdir -p build/ios

      - name: Exportar proyecto Xcode de iOS (Godot no firma; export_project_only=true)
        run: godot --headless --export-release "iOS" build/ios/demons.ipa

      - name: Forzar firma manual en el .pbxproj (Godot deja el perfil vacío)
        # Godot ya exporta con CODE_SIGN_STYLE=Manual (no hace falta
        # tocarlo) pero deja CODE_SIGN_IDENTITY en el nombre legacy
        # ("iPhone Distribution") y PROVISIONING_PROFILE_SPECIFIER vacío.
        # Se apunta la identidad al nombre moderno que coincide con el
        # certificado importado más abajo, y el specifier al perfil de
        # Distribución instalado en el paso anterior.
        run: |
          PBXPROJ="build/ios/demons.xcodeproj/project.pbxproj"
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Distribution";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' "$PBXPROJ"
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = "";/PROVISIONING_PROFILE_SPECIFIER = "CI TestFlight Distribution";/g' "$PBXPROJ"

      - name: Importar certificado de distribución en un keychain temporal
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}

      - name: Instalar el provisioning profile de distribución
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.APPLE_DISTRIBUTION_PROVISIONING_PROFILE }}" | base64 --decode > \
            ~/Library/MobileDevice/Provisioning\ Profiles/CITestFlightDistribution.mobileprovision

      - name: Guardar la App Store Connect API Key donde xcrun altool la espera
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > \
            ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Archivar con xcodebuild (firma manual, certificado y perfil ya instalados)
        working-directory: build/ios
        run: |
          xcodebuild archive \
            -project demons.xcodeproj \
            -scheme demons \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/demons.xcarchive"

      - name: Crear exportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ env.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.juanpvivas.demons</key>
              <string>CI TestFlight Distribution</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Exportar el .ipa desde el archive
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/demons.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist"

      - name: Subir a TestFlight
        run: |
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/demons.ipa" \
            -t ios \
            --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
