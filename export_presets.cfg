; Export presets para Godot 4.7. Preset de Android escrito a mano siguiendo
; el formato estándar de Godot (ver godot-prompter:export-pipeline) y
; verificado con un export real en local (SDK de Android + export templates
; de Godot instalados): `godot --headless --export-debug "Android"
; build/android/demons.apk` produce un APK firmado que pasa
; `apksigner verify` (v2 y v3 scheme). Requirió además habilitar
; `textures/vram_compression/import_etc2_astc=true` en project.godot.
;
; Preset de iOS: campos de aplicación verificados directamente contra los
; nombres reales del binario de Godot (`strings` sobre el ejecutable —
; varios nombres de campo "obvios" que se probaron primero, como
; `application/identifier` o `application/name`, no existen; el real es
; `application/bundle_identifier`). Con `application/export_project_only=true`,
; `godot --headless --export-debug "iOS" build/ios/demons.ipa` genera un
; `demons.xcodeproj` limpio, verificado localmente (Xcode 27, Team ID
; XA43X2P8W2) — sin ese flag, Godot intenta invocar `xcodebuild archive` él
; mismo y falla porque no puede pasarle `-allowProvisioningUpdates` (necesita
; sesión interactiva para crear el primer perfil de aprovisionamiento). Por
; eso el build+firma+subida a TestFlight se hacen aparte, en
; `.github/workflows/deploy-ios-testflight.yml`. Bugs reales encontrados
; en el camino: `application/min_ios_version` no puede ser menor a 15.0 con
; Xcode 27 (14.0 falla); declarar `entitlements/push_notifications=false`
; explícitamente genera un `.entitlements` con `aps-environment=false`
; (string literal) que Xcode interpreta como "quiere push notifications" —
; mejor no declarar la clave en absoluto que declararla en `false`; y el
; `.pbxproj` que genera Godot siempre trae `CODE_SIGN_STYLE = "Manual"` con
; el perfil vacío y `CODE_SIGN_IDENTITY` fijo ("iPhone Distribution"/
; "iPhone Developer") — no hay ningún campo de preset para pedir firma
; automática, así que el workflow de CI parchea el `.pbxproj` con `sed`
; después del export de Godot (ver ese archivo para el detalle exacto).
;
; Si en algún momento se edita desde el editor de Godot (Project → Export),
; Godot va a regenerar/reescribir este archivo con el formato exacto de su
; versión — no pasa nada, es el comportamiento esperado.
; No se commitean secretos acá (contraseñas de keystore, etc.) — esos van
; como variables de entorno/secrets de CI, nunca en este archivo.

