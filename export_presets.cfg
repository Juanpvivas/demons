; Export presets para Godot 4.7. Generado a mano siguiendo el formato
; estándar de Godot (ver godot-prompter:export-pipeline) porque no hay
; SDK de Android instalado en esta máquina para generarlo desde el editor.
;
; IMPORTANTE: la próxima vez que alguien abra este proyecto en el editor de
; Godot y entre a Project → Export, Godot va a regenerar/reescribir este
; archivo con el formato exacto de su versión — si algún campo de abajo no
; coincide con lo que el editor espera, se corrige solo al guardar desde ahí.
; No se commitean secretos acá (contraseñas de keystore, etc.) — esos van
; como variables de entorno/secrets de CI, nunca en este archivo.

[preset.0]

name="Android"
platform="Android"
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/android/demons.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

