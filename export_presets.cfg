; Export presets para Godot 4.7. Preset de Android escrito a mano siguiendo
; el formato estándar de Godot (ver godot-prompter:export-pipeline) y
; verificado con un export real en local (SDK de Android + export templates
; de Godot instalados): `godot --headless --export-debug "Android"
; build/android/demons.apk` produce un APK firmado que pasa
; `apksigner verify` (v2 y v3 scheme). Requirió además habilitar
; `textures/vram_compression/import_etc2_astc=true` en project.godot.
;
; Si en algún momento se edita desde el editor de Godot (Project → Export),
; Godot va a regenerar/reescribir este archivo con el formato exacto de su
; versión — no pasa nada, es el comportamiento esperado.
; No se commitean secretos acá (contraseñas de keystore, etc.) — esos van
; como variables de entorno/secrets de CI, nunca en este archivo.

[preset.0]

name="Android"
platform="Android"
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/android/demons.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
version/code=1
version/name="1.0"
package/unique_name="com.juanpvivas.demons"
package/name="Demonios de las Trincheras"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
launcher_icons/adaptive_monochrome_432x432=""
graphics/opengl_debug=false
xr_features/xr_mode=0
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
